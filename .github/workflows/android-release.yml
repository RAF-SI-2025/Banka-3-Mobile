name: Android release APK

# Builds a release APK and attaches it to a GitHub Release.
#   - push a tag  v1.2.3      -> builds + publishes a Release with the APK
#   - manual run (Actions tab) -> builds + uploads the APK as a run artifact
#
# This is a Continuous-Native-Generation (CNG) Expo app: android/ is
# gitignored and regenerated by `expo prebuild`, so CI prebuilds first.
#
# EXPO_PUBLIC_* is baked into the JS bundle AT BUILD TIME — a localhost
# base is dead on a real phone. Set repo Variable EXPO_PUBLIC_API_BASE_URL
# to a reachable/deployed gateway (Settings > Secrets and variables >
# Actions > Variables).
#
# Signing: if the ANDROID_KEYSTORE_BASE64 secret is set, the APK is signed
# with your keystore; otherwise it falls back to the Expo debug key
# (installable for demos, NOT suitable for distribution / Play Store).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'EXPO_PUBLIC_API_BASE_URL to bake in (overrides repo Variable)'
        required: false

permissions:
  contents: write   # needed to create the Release on tag push

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.EXPO_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if API base is missing or loopback
        run: |
          API="${EXPO_PUBLIC_API_BASE_URL:-}"
          if [ -z "$API" ]; then
            echo "::error::EXPO_PUBLIC_API_BASE_URL is empty. Set repo Variable EXPO_PUBLIC_API_BASE_URL or pass api_base_url on manual run."
            exit 1
          fi
          if printf '%s' "$API" | grep -qiE 'localhost|127\.0\.0\.1|10\.0\.2\.2'; then
            echo "::error::API base '$API' is loopback — useless on a real device. Point it at a deployed gateway."
            exit 1
          fi
          echo "API base to embed: $API"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm ci   # .npmrc sets legacy-peer-deps=true

      - name: Prebuild native android project (CNG)
        run: npx --no-install expo prebuild --platform android --clean --no-install

      - name: Provision Android SDK packages
        run: |
          COMPILE_SDK="$(grep -E '^android.compileSdkVersion=' android/gradle.properties | head -1 | cut -d= -f2)"
          BUILD_TOOLS="$(grep -E '^android.buildToolsVersion=' android/gradle.properties | head -1 | cut -d= -f2)"
          COMPILE_SDK="${COMPILE_SDK:-36}"; BUILD_TOOLS="${BUILD_TOOLS:-36.0.0}"
          echo "compileSdk=$COMPILE_SDK buildTools=$BUILD_TOOLS"
          yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-$COMPILE_SDK" "build-tools;$BUILD_TOOLS" >/dev/null

      - name: Decode signing keystore (if provided)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded — building a signed release."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret — building a debug-signed release (demo only)."
          fi

      - name: Gradle assembleRelease
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon --console=plain \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew :app:assembleRelease --no-daemon --console=plain
          fi

      - name: Locate APK
        id: apk
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          [ -n "$APK" ] || { echo "::error::no release APK produced"; exit 1; }
          cp "$APK" "banka3-${GITHUB_REF_NAME}.apk"
          echo "path=banka3-${GITHUB_REF_NAME}.apk" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: banka3-release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
